<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enduro Bike Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #preview {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 6px;
            display: none;
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            width: 400px;
            white-space: pre-wrap;
        }

        .retailer-banner {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            background-color: #2d6cdf;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .retailer-banner:hover {
            background-color: #1f4fb3;
        }
    </style>
</head>
<body>
    <h1>Enduro Bike Classifier</h1>

    <p>Upload an image to get a prediction from the API.</p>

    <form id="upload-form">
        <label for="image">Upload an image:</label><br><br>
        <input type="file" id="image" name="image" accept="image/*">
        <br><br>
        <button type="button" id="predict-btn">Predict</button>
    </form>

    <!-- Image Preview -->
    <img id="preview" src="" alt="Image preview">

    <h3>Result:</h3>
    <div id="result-box">No prediction yet.</div>

    <div id="retailer-container"></div>

    <script>
        // Show preview when image is selected
        document.getElementById("image").addEventListener("change", () => {
            const fileInput = document.getElementById("image");
            const preview = document.getElementById("preview");

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        });

        // Predict button logic
        document.getElementById("predict-btn").addEventListener("click", async () => {
            const fileInput = document.getElementById("image");
            const resultBox = document.getElementById("result-box");
            const retailerContainer = document.getElementById("retailer-container");

            retailerContainer.innerHTML = ""; // Clear previous banner

            if (!fileInput.files.length) {
                resultBox.textContent = "Please upload an image first.";
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            resultBox.textContent = "Predicting...";

            try {
                const response = await fetch("http://localhost:8000/predict", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    resultBox.textContent = "Error: " + response.statusText;
                    return;
                }

                const data = await response.json();

                // Display prediction + confidence
                resultBox.textContent =
                    `Prediction: ${data.prediction}\n` +
                    `Confidence: ${(data.confidence * 100).toFixed(1)}%`;

                // Show retailer banner only if URL exists
                if (data.retailer_url) {
                    const banner = document.createElement("a");
                    banner.href = data.retailer_url;
                    banner.target = "_blank";
                    banner.className = "retailer-banner";
                    banner.textContent = "View on Backcountry";
                    retailerContainer.appendChild(banner);
                }

            } catch (error) {
                resultBox.textContent = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
